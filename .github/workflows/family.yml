name: Compilar MyFamilyTube

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAMILY_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Firma (clave guardada en los secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos FAMILY_KEYSTORE_B64 y FAMILY_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/myfamilytube.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/myfamilytube.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=myfamilytube"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew assembleStfamilyRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Guardar el error si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Preparar APK y fichero de actualización
        run: |
          N=${FAMILY_BUILD_NUMBER}
          cp smarttubetv/build/outputs/apk/stfamily/release/*_universal.apk MyFamilyTube.apk
          CHANGE=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          cat > myfamilytube.json <<EOF
          {
            "package": {
              "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v1.0.${N}/MyFamilyTube.apk"
            },
            "1.0.${N}": {
              "versionCode": ${N},
              "changelog": ["${CHANGE}"]
            }
          }
          EOF

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${FAMILY_BUILD_NUMBER}" MyFamilyTube.apk myfamilytube.json \
            --title "MyFamilyTube 1.0.${FAMILY_BUILD_NUMBER}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
