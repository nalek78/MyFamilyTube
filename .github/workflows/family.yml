name: Compilar MyFamilyTube

on:
  push:
    # master publishes a Release; prueba only checks that it compiles
    branches: [ "master", "prueba" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Firma (clave guardada en los secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos FAMILY_KEYSTORE_B64 y FAMILY_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/myfamilytube.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/myfamilytube.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=myfamilytube"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          # TV and phone apps
          ./gradlew assembleStfamilyRelease assembleStfamilymobileRelease assembleStfamilymusicRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Comprobar enlaces de YouTube del móvil
        if: github.ref == 'refs/heads/prueba'
        run: |
          M=$(find smarttubetv/build/intermediates -path '*stfamilymobileRelease*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Manifiesto: $M"
          python3 - "$M" <<'PY'
          import sys, xml.etree.ElementTree as ET
          A = '{http://schemas.android.com/apk/res/android}'
          root = ET.parse(sys.argv[1]).getroot()
          for act in root.iter('activity'):
              for f in act.findall('intent-filter'):
                  actions = [a.get(A + 'name').split('.')[-1] for a in f.findall('action')]
                  if 'VIEW' in actions or 'SEND' in actions:
                      data = [':'.join(filter(None, [d.get(A + 'scheme'), d.get(A + 'host'), d.get(A + 'pathPrefix') or d.get(A + 'pathPattern')])) for d in f.findall('data')]
                      print(act.get(A + 'name').split('.')[-1], actions, data)
          PY

      - name: Guardar el error si falla (rama build-log)
        if: failure()
        run: |
          grep -n -E "error:|ERROR|FAILED|What went wrong|e: |Exception" build.log | head -200 > errors.txt || true
          tail -150 build.log >> errors.txt
          SHA=$(git rev-parse --short HEAD)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f errors.txt
          git commit -m "Error de compilación en ${SHA}"
          git push -f origin build-log

      - name: Preparar APKs y ficheros de actualización
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Each app has its own version (versiones.properties). An app whose number didn't change
          # keeps the APK and update file of the previous release, so it gets no update notice.
          TV=$(grep -E '^tv=' versiones.properties | cut -d= -f2 | tr -d '[:space:]')
          MOVIL=$(grep -E '^movil=' versiones.properties | cut -d= -f2 | tr -d '[:space:]')
          MUSICA=$(grep -E '^musica=' versiones.properties | cut -d= -f2 | tr -d '[:space:]')
          TAG="tv-1.0.${TV}_movil-1.0.${MOVIL}_musica-1.0.${MUSICA}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::error::Ya existe una versión con TV 1.0.${TV}, Móvil 1.0.${MOVIL} y Música 1.0.${MUSICA}: sube el número de la app que ha cambiado en versiones.properties"
            exit 1
          fi
          PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          mkdir -p prev
          if [ -n "$PREV" ]; then
            gh release download "$PREV" -D prev -p '*.json' -p '*.apk' || true
          fi
          CHANGE=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          NOTES=""
          for APP in "MyFamilyTube:myfamilytube:stfamily:${TV}:TV" "MyFamilyTube-movil:myfamilytube-movil:stfamilymobile:${MOVIL}:Móvil" "MyFamilyMusic:myfamilymusic:stfamilymusic:${MUSICA}:Música"; do
            IFS=: read -r APK JSON FLAVOR VER LABEL <<< "$APP"
            OLD=$(grep -o '"versionCode": *[0-9]*' "prev/${JSON}.json" 2>/dev/null | grep -o '[0-9]*$' || true)
            if [ "$OLD" = "$VER" ] && [ -f "prev/${APK}.apk" ]; then
              cp "prev/${APK}.apk" "${APK}.apk"
              LOG="Sin cambios"
              NOTES="${NOTES}${LABEL} 1.0.${VER}: sin cambios"$'\n'
            else
              cp smarttubetv/build/outputs/apk/${FLAVOR}/release/*_universal.apk "${APK}.apk"
              LOG="${CHANGE}"
              NOTES="${NOTES}${LABEL} 1.0.${VER}: nueva"$'\n'
            fi
            # The app's update checker needs versionName and versionCode; both APKs are in every release
            cat > "${JSON}.json" <<EOF
          {
            "package": {
              "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK}.apk"
            },
            "1.0.${VER}": {
              "versionName": "1.0.${VER}",
              "versionCode": ${VER},
              "changelog": ["${LOG}"]
            }
          }
          EOF
          done
          {
            echo "TAG=${TAG}"
            echo "TITLE=MyFamilyTube · TV 1.0.${TV} · Móvil 1.0.${MOVIL} · Música 1.0.${MUSICA}"
          } >> "$GITHUB_ENV"
          printf '%s\n%s' "$NOTES" "$(git log -1 --pretty=%B)" > notes.txt

      - name: Publicar Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" MyFamilyTube.apk myfamilytube.json \
            MyFamilyTube-movil.apk myfamilytube-movil.json \
            MyFamilyMusic.apk myfamilymusic.json \
            --title "$TITLE" \
            --notes-file notes.txt \
            --latest
