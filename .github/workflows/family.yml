name: Compilar MyFamilyTube

on:
  push:
    # master publishes a Release; prueba only checks that it compiles
    branches: [ "master", "prueba" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FAMILY_BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Firma (clave guardada en los secretos del repositorio)
        env:
          KEYSTORE_B64: ${{ secrets.FAMILY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.FAMILY_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos FAMILY_KEYSTORE_B64 y FAMILY_KEYSTORE_PASSWORD"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/myfamilytube.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/myfamilytube.keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=myfamilytube"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      - name: Compilar
        run: |
          chmod +x gradlew
          # TV and phone apps
          ./gradlew assembleStfamilyRelease assembleStfamilymobileRelease 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Guardar el error si falla (rama build-log)
        if: failure()
        run: |
          grep -n -E "error:|ERROR|FAILED|What went wrong|e: |Exception" build.log | head -200 > errors.txt || true
          tail -150 build.log >> errors.txt
          SHA=$(git rev-parse --short HEAD)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan build-log
          git rm -rf --cached . > /dev/null
          git add -f errors.txt
          git commit -m "Error de compilación en ${SHA}"
          git push -f origin build-log

      - name: Preparar APKs y ficheros de actualización
        if: github.ref == 'refs/heads/master'
        run: |
          N=${FAMILY_BUILD_NUMBER}
          cp smarttubetv/build/outputs/apk/stfamily/release/*_universal.apk MyFamilyTube.apk
          cp smarttubetv/build/outputs/apk/stfamilymobile/release/*_universal.apk MyFamilyTube-movil.apk
          CHANGE=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          for APP in MyFamilyTube:myfamilytube MyFamilyTube-movil:myfamilytube-movil; do
            APK="${APP%%:*}"
            JSON="${APP##*:}"
            cat > "${JSON}.json" <<EOF
          {
            "package": {
              "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/v1.0.${N}/${APK}.apk"
            },
            "1.0.${N}": {
              "versionCode": ${N},
              "changelog": ["${CHANGE}"]
            }
          }
          EOF
          done

      - name: Publicar Release
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${FAMILY_BUILD_NUMBER}" MyFamilyTube.apk myfamilytube.json \
            MyFamilyTube-movil.apk myfamilytube-movil.json \
            --title "MyFamilyTube 1.0.${FAMILY_BUILD_NUMBER}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
